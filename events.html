<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F45 Upcoming Events</title>
<link rel="preload" href="./BebasNeue.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./Montserrat.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family:'Bebas Neue'; src:url(./BebasNeue.woff2) format('woff2'); font-weight:400 700; font-display:block; }
  @font-face { font-family:'Montserrat'; src:url(./Montserrat.woff2) format('woff2'); font-weight:100 900; font-display:block; }
  :root { --navy:#211551; --red:#D6001C; --paper:#FAF8F3; --ink:#444444; }
  html, body { margin:0; height:100%; background:var(--navy); overflow:hidden; }
  #viewport { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .stage {
    width:1920px; height:1080px; position:relative; overflow:hidden; flex-shrink:0;
    background:var(--navy); font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;
    transform-origin:center center;
  }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; }
  .scrim { position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(33,21,81,.95) 0%, rgba(33,21,81,.85) 35%, rgba(33,21,81,.55) 100%); }
  .layout { position:absolute; inset:0; box-sizing:border-box; padding:70px 80px; display:flex; gap:80px; }
  .left { width:500px; flex-shrink:0; display:flex; flex-direction:column; justify-content:space-between; }
  .logo { height:80px; width:auto; align-self:flex-start; }
  .month { font-size:30px; font-weight:800; letter-spacing:9px; color:var(--paper); text-transform:uppercase; margin-bottom:20px; }
  .title { font-family:'Bebas Neue',Impact,sans-serif; font-size:168px; line-height:.86; letter-spacing:2px; color:#fff; }
  .title.red { color:var(--red); }
  .rule { width:90px; height:6px; background:var(--paper); margin-top:34px; }
  .studio { font-size:30px; font-weight:800; letter-spacing:5px; color:var(--paper); text-transform:uppercase; }
  .list { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:26px; }
  .ticket { flex:1 1 0; min-height:0; max-height:190px; display:flex; border-radius:18px; overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.35); }
  .body { flex:1; min-width:0; background:var(--paper); padding:0 50px; box-sizing:border-box;
    display:flex; flex-direction:column; justify-content:center; gap:4px; }
  .name { font-family:'Bebas Neue',Impact,sans-serif; font-size:64px; line-height:1; letter-spacing:1.5px; color:var(--navy); }
  .detail { font-size:28px; font-weight:600; color:var(--ink); }
  .name, .detail { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stub { width:250px; box-sizing:border-box; background:var(--red); border-left:6px dashed var(--paper); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .mon { font-size:26px; font-weight:800; letter-spacing:6px; }
  .day { font-family:'Bebas Neue',Impact,sans-serif; font-size:104px; line-height:.85; margin-top:6px; }
  .day.range { font-size:76px; margin-top:12px; }
  .ticket.empty .body { align-items:flex-start; }
  .notice { position:fixed; left:0; right:0; bottom:0; padding:10px 16px; font:600 14px Montserrat,Arial,sans-serif;
    background:#fff3cd; color:#5c4400; text-align:center; z-index:5; }
</style>
</head>
<body>
<div id="viewport">
  <div class="stage" id="stage">
    <img class="bg" src="./events-bg.jpg" alt="" aria-hidden="true">
    <div class="scrim" aria-hidden="true"></div>
    <div class="layout">
      <div class="left">
        <img class="logo" src="./f45-logo-white.png" alt="F45 Training">
        <div>
          <div class="month" id="month"></div>
          <div class="title">Upcoming</div>
          <div class="title red">Events</div>
          <div class="rule"></div>
        </div>
        <div class="studio" id="studio"></div>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>
<div class="notice" id="notice" hidden></div>
<script src="./config.js"></script>
<script src="./events.js"></script>
</body>
</html>
